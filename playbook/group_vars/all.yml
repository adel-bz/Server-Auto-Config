---
# User account
user: "ubuntu"
# Required account password; sudo is passwordless and SSH remains key-only. Use Ansible Vault.
password: "CHANGE_ME"

# SSH access
ssh_port: "7600"
# Paste your single-line OpenSSH public key for the managed user.
ssh_public_key: "ssh-rsa  adel@adel"

# GitLab Runner
gitlab_runner_url: "https://gitlab.example.com"
gitlab_runner_registration_token: "REPLACE_WITH_GITLAB_RUNNER_TOKEN"
gitlab_runner_executor: "shell"

# Firewall: one combined allow rule per port covers BOTH TCP and UDP.
# Examples: [7600, 80, 443, 8080] or [7600].
# SSH is allowed automatically; you do NOT need to add ssh_port to this list.
firewall_allowed_ports: [80, 443]

# Docker group access bypasses sudo and is root-equivalent. Explicit opt-in only.
docker_add_user_to_group: false

# Docker log rotation: maximum number of files and size per file.
docker_log_max_file: 3
docker_log_max_size: "50m"
