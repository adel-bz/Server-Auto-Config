## Organizing roles and group variables ##

---

########################################################

# Play 1 — apply/validate SSH without restarting it or changing this connection.
# After the final reboot, users must update their SSH login user/port/key.
- name: Server Configs through SSH
  hosts: all
  roles:
    - role: ../roles/user_config
    - role: ../roles/manage_packages
    - role: ../roles/install_deps
    - role: ../roles/gitlab_runner
    - role: ../roles/ssh_config

########################################################

# Play 2 — finish configuration, allow SSH in UFW, then schedule reboot (no wait).
- name: Server Configs swap and hardening
  hosts: all
  roles:
    - role: ../roles/swap_config
    - role: ../roles/fail2ban
    - role: ../roles/firewall
    - role: ../roles/reboot

########################################################
