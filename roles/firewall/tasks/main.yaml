## Firewall config role task ##

---

# 1. Validate user-selected ports before changing UFW #

- name: Require a list of firewall ports
  ansible.builtin.assert:
    that:
      - firewall_allowed_ports is sequence
      - firewall_allowed_ports is not string
      - firewall_allowed_ports is not mapping
    fail_msg: 'Set firewall_allowed_ports to a list, for example [7600, 80, 443, 8080] or [7600].'

- name: Validate each configured firewall port
  ansible.builtin.assert:
    that:
      - (item | string) is match('^[0-9]+$')
      - item | int >= 1
      - item | int <= 65535
    fail_msg: 'Each firewall_allowed_ports entry must be a port number between 1 and 65535.'
  loop: "{{ firewall_allowed_ports }}"

- name: Validate the SSH firewall port
  ansible.builtin.assert:
    that:
      - (ssh_port | string) is match('^[0-9]+$')
      - ssh_port | int >= 1
      - ssh_port | int <= 65535
    fail_msg: 'ssh_port must be a port number between 1 and 65535.'

- name: Ensure UFW is installed
  ansible.builtin.apt:
    name: ufw
    state: present
  become: true

# Omitting proto creates one allow rule per port, covering BOTH TCP and UDP.
- name: Allow configured firewall ports with one combined rule per port
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
  loop: "{{ firewall_allowed_ports | map('int') | unique | list }}"
  become: true

# Add the combined allow before removing equivalent older TCP/UDP allow rules.
# Only unrestricted allow rules for currently selected ports are replaced.
- name: Remove redundant split allow rules for configured firewall ports
  community.general.ufw:
    rule: allow
    port: "{{ item.0 | string }}"
    proto: "{{ item.1 }}"
    delete: true
  loop: "{{ firewall_allowed_ports | map('int') | unique | product(['tcp', 'udp']) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"
  become: true

# SSH is always allowed; users do NOT need to add ssh_port to the port list.
- name: Keep SSH allowed when its port is not already in the service port list
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port | string }}"
    proto: tcp
  become: true
  when: (ssh_port | int) not in (firewall_allowed_ports | map('int') | list)

- name: Enable UFW after allowing configured ports and SSH
  community.general.ufw:
    state: enabled
  become: true

##################################################################
