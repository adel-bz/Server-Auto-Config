## SSH config role tasks ## 

---

# 1. Add SSH public key to server #

- name: Add SSH public key to Ubuntu server (Create SSH directory for user)
  file:
    path: "/home/{{ user }}/.ssh"
    state: directory
    mode: "0700"
    owner: "{{ user }}"
    group: "{{ user }}"
  become: true

- name: Add SSH public key to authorized_keys
  ansible.posix.authorized_key:
    user: "{{ user }}"
    key: "{{ ssh_public_key }}"
    state: present
  become: true

##################################################################

# 2. Change SSH config file and port #

- name: Check whether SSH socket activation is active
  command: systemctl is-active ssh.socket
  register: ssh_socket_active
  changed_when: false
  failed_when: ssh_socket_active.rc not in [0, 3, 4]
  check_mode: false
  become: true

- name: Check whether UFW is installed
  stat:
    path: /usr/sbin/ufw
  register: ssh_ufw_binary

- name: Allow configured SSH port before restarting SSH
  command: /usr/sbin/ufw allow {{ ssh_port }}/tcp
  register: ssh_ufw_allow
  changed_when: "'Rule added' in ssh_ufw_allow.stdout or 'Rules updated' in ssh_ufw_allow.stdout"
  when: ssh_ufw_binary.stat.exists
  environment:
    LC_ALL: C
  become: true

- name: Copy config sshd_config file to server
  copy:
    src: sshd_config
    dest: /etc/ssh/sshd_config
    remote_src: false
    validate: /usr/sbin/sshd -t -f %s
    backup: true
  notify: Restart SSH
  become: true

- name: Change SSH port in sshd_config
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?Port"
    line: "Port {{ ssh_port }}"
    backup: true
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH
  become: true

##################################################################
