# Schedule the final reboot after configuration; never wait for reconnection.
# Success means the reboot request was accepted, not that booting completed.
# If ssh_config ran, update the SSH user/port/key before the next connection.

---

# Flush handlers while the existing SSH connection is still available.

- name: Apply pending handlers before scheduling the final reboot
  ansible.builtin.meta: flush_handlers

# A one-minute delay lets the command return successfully before SSH goes down.
- name: Schedule the final reboot without waiting for the server to return
  ansible.builtin.command:
    argv:
      - /sbin/shutdown
      - -r
      - '+1'
      - Reboot initiated by Ansible
  changed_when: true
  become: true
  when: not ansible_check_mode

